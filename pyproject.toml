[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ki-cad"
version = "0.1.0"
description = "CAD blueprint symbol detection MVP with geometry and VLM-comparable outputs"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pillow>=10",
  "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
ki-cad = "ki_cad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
